[package]
edition = "2021"
name    = "videos-extension"
version = "0.1.0"

[lib]
crate-type = ["cdylib"]

[workspace]
# Empty workspace to exclude from parent

[dependencies]
serde          = { version = "1.0", features = ["derive"] }
serde_json     = "1.0"
spacedrive-sdk = { path = "../../crates/sdk" }
uuid           = { version = "1.0", default-features = false, features = ["rng-rand", "serde", "v4", "v5"] }

[profile.release]
codegen-units = 1
lto           = true
opt-level     = "z"
