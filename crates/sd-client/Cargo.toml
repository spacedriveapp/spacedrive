[package]
name    = "sd-client"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow     = "1"
sd-core    = { path = "../../core" }
serde      = "1"
serde_json = "1"
tokio      = { version = "1", features = ["fs", "io-util", "macros", "net", "rt", "sync", "time"] }
tracing    = "0.1"
uuid       = { version = "1", features = ["serde", "v4"] }

[dev-dependencies]
tempfile = "3.14"
tokio    = { version = "1", features = ["rt-multi-thread"] }
