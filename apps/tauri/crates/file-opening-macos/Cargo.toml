[package]
name = "file-opening-macos"
version = "0.1.0"
edition = "2021"

[dependencies]
file-opening = { path = "../file-opening" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# A plain workspace member is checked on every host, so the Swift bridge is
# only pulled in where it can link.
[target.'cfg(target_os = "macos")'.dependencies]
swift-rs = "1.0"

[target.'cfg(target_os = "macos")'.build-dependencies]
swift-rs = { version = "1.0", features = ["build"] }
