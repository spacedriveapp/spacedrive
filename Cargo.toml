[workspace]
exclude = ["crates/json-sample-derive", "extensions/*"]
members = [
	# "apps/cloud",
	# "apps/desktop/crates/*",
	# "apps/desktop/src-tauri",
	# "apps/mobile/modules/sd-core/android/crate",
	# "apps/mobile/modules/sd-core/core",
	# "apps/mobile/modules/sd-core/ios/crate",
	"apps/mobile/modules/sd-mobile-core/core",
	"apps/server",
	"apps/cli",
	"apps/native",
	"apps/tauri/sd-tauri-core",
	"apps/tauri/src-tauri",
	"core",
	"core/benchmarks",
	"crates/*",
	"xtask"
]
# Exclude Tauri from default builds - it requires frontend to be built first
# Use `cd apps/tauri && bun run tauri:dev` to run the Tauri app
# apps/native is also excluded so default checks don't build the gpui tree;
# run it with `cargo run --release -p sd-native`
default-members = [
	"apps/server",
	"apps/cli",
	"core",
	"core/benchmarks",
	"crates/*",
	"xtask"
]
resolver = "2"

[workspace.package]
edition      = "2021"
license      = "Apache-2.0"
repository   = "https://github.com/spacedriveapp/spacedrive"
rust-version = "1.81"

[workspace.dependencies]
# First party dependencies
# sd-cloud-schema = { git = "https://github.com/spacedriveapp/cloud-services-schema", rev = "515ba740ea" }

# GPUI, pinned to our fork of zed (branch `spacedrive`). The rev is the one
# gpui-component's lockfile resolves, so both trees agree on the API surface.
# Upgrades are a deliberate ritual: bump gpui-component, move this rev to its
# lock, rebase any fork patches. Fork patches are changelogged here as they land.
# gpui carries an explicit version because the zed tree also contains a 0.0.0
# `gpui` lint-test fixture that would otherwise make resolution ambiguous.
gpui           = { version = "0.2.2", git = "https://github.com/spacedriveapp/zed", rev = "e0931d5a9dbf4f781b336fdf448739e74a2ac0b5" }
gpui_platform  = { git = "https://github.com/spacedriveapp/zed", rev = "e0931d5a9dbf4f781b336fdf448739e74a2ac0b5", features = ["font-kit"] }
gpui_macros    = { git = "https://github.com/spacedriveapp/zed", rev = "e0931d5a9dbf4f781b336fdf448739e74a2ac0b5" }
gpui-component = { git = "https://github.com/longbridge/gpui-component", rev = "7acfc184382d30864a688fdaa6c9ff719efc53ae" }

# Third party dependencies used by one or more of our crates
anyhow              = "1.0.94"
async-channel       = "2.3"
async-stream        = "0.3.6"
async-trait         = "0.1.83"
axum                = "0.7.9"
axum-extra          = "0.9.6"
base64              = "0.22.1"
blake3              = "1.5.5"
bytes               = "1.9.0"
chrono              = "0.4.39"
ed25519-dalek       = "2.1"
flume               = "0.11.0"
futures             = "0.3.31"
futures-concurrency = "7.6.2"
globset             = "0.4.15"
http                = "1.2.0"
hyper               = "1.5.2"
image               = "0.25.5"
iroh                = "0.95.1"
itertools           = "0.13.0"
lending-stream      = "1.0"
libc                = "0.2.169"
mimalloc            = "0.1.43"
normpath            = "1.3"
pin-project-lite    = "0.2.15"
quic-rpc            = "0.17.3"
rand                = "0.9.0-alpha.2"
regex               = "1.11.1"
reqwest             = { version = "0.12.9", default-features = false }
rmp                 = "0.8.14"
rmp-serde           = "1.3"
rmpv                = { version = "1.3", features = ["with-serde"] }
serde               = "1.0.216"
serde_json          = "1.0.133"
specta              = { git = "https://github.com/jamiepine/specta", branch = "main" }
strum               = "0.26"
strum_macros        = "0.26"
tempfile            = "3.14.0"
thiserror           = "2.0.8"
tokio               = "1.42.0"
tokio-stream        = "0.1.17"
tokio-util          = "0.7.13"
tracing             = "0.1.41"
tracing-subscriber  = "0.3.19"
tracing-test        = "0.2.5"
uhlc                = "0.8.0"                                          # Must follow version used by specta
uuid                = "1.10"                                           # Must follow version used by specta
webp                = "0.3.0"
zeroize             = "1.8"
sqlx                = { version = "0.8", default-features = false, features = ["sqlite", "runtime-tokio"] }
lancedb             = "0.15"
fastembed           = "4"
arrow-array         = "53.3"
arrow-schema        = "53.3"
indexmap            = "2.7"
dashmap             = "6.1"
toml                = "0.8"
ort                 = { version = "2.0.0-rc.9", default-features = false, features = ["download-binaries", "tls-native"] }

# Proper IOS Support
# TODO: Fix the fork - it has compilation errors with TimerFuture
# [patch.crates-io.if-watch]
# git = "https://github.com/spacedriveapp/if-watch.git"
# rev = "a92c17d3f8"

# gpui-component depends on zed-industries/zed with no rev pin; reroute every
# zed-tree crate it pulls onto our fork at the pinned rev so exactly one gpui
# exists in the graph. `[patch]` matches by version, so the fork must not bump
# the zed crates' version numbers.
[patch."https://github.com/zed-industries/zed"]
gpui          = { version = "=0.2.2", git = "https://github.com/spacedriveapp/zed", rev = "e0931d5a9dbf4f781b336fdf448739e74a2ac0b5" }
gpui_platform = { git = "https://github.com/spacedriveapp/zed", rev = "e0931d5a9dbf4f781b336fdf448739e74a2ac0b5" }
gpui_macros   = { git = "https://github.com/spacedriveapp/zed", rev = "e0931d5a9dbf4f781b336fdf448739e74a2ac0b5" }

[profile.dev]
# Make compilation faster on macOS
codegen-units   = 256
debug           = 0
incremental     = true
lto             = false
opt-level       = 0
split-debuginfo = "unpacked"
strip           = "none"

[profile.dev-debug]
inherits = "dev"
# Enables debugger
codegen-units = 256
debug         = "full"
incremental   = true
lto           = "off"
opt-level     = 0
# split-debuginfo = "none"
strip = "none"

# Set the settings for build scripts and proc-macros.
[profile.dev.build-override]
opt-level = 3

# Set the default for dependencies, except workspace members.
[profile.dev.package."*"]
incremental = false
opt-level   = 3

# Set the default for dependencies, except workspace members.
[profile.dev-debug.package."*"]
debug       = "full"
incremental = false
inherits    = "dev"
opt-level   = 3

# Optimize release builds
[profile.release]
codegen-units = 1        # Compile crates one after another so the compiler can optimize better
lto           = true     # Enables link to optimizations
opt-level     = "s"      # Optimize for binary size
panic         = "unwind" # Sadly we need unwind to avoid unexpected crashes on third party crates
strip         = true     # Remove debug symbols

# Fast mobile development profile - trades binary size for build speed
# Use with: cargo build --profile mobile-dev
# For production mobile releases, use --release instead
[profile.mobile-dev]
inherits      = "release"
codegen-units = 16       # Allow parallel compilation (vs 1 in release)
lto           = false    # Disable link-time optimization (saves 15-20 min per arch)
opt-level     = 2        # Good optimization without extreme size focus
strip         = true     # Still remove debug symbols

# `smb-server` needs RC4 to unwrap NTLM session keys, and the published
# `rc4 0.2` pulls `crypto-common 0.2.2` — which cargo cannot reconcile with
# the `0.2.0-rc.4` that iroh pins through its exact `aead = "=0.6.0-rc.2"`.
# The shim has the same surface and no dependencies. Delete it, and this
# patch, once iroh moves off the aead pre-release.
[patch.crates-io]
rc4 = { path = "crates/rc4-shim" }
