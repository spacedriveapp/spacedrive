name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build every artifact without signing, tagging or creating a release; results are workflow artifacts only
        type: boolean
        default: true

# Every job reads the repository only; the release job alone gets write access,
# and it never runs in a dry run.
permissions:
  contents: read

# From: https://github.com/rust-lang/rust-analyzer/blob/master/.github/workflows/release.yaml#L13-L21
env:
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  RUSTUP_MAX_RETRIES: 10

jobs:
  # Server builds for self-hosting
  server-build:
    strategy:
      matrix:
        settings:
          - host: blacksmith-4vcpu-ubuntu-2204
            target: x86_64-unknown-linux-gnu
            platform: linux-x86_64
          - host: blacksmith-4vcpu-ubuntu-2204-arm
            target: aarch64-unknown-linux-gnu
            platform: linux-aarch64
    name: Server - ${{ matrix.settings.platform }}
    runs-on: ${{ matrix.settings.host }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          target: ${{ matrix.settings.target }}

      - name: Install VA-API libraries
        if: matrix.settings.target == 'aarch64-unknown-linux-gnu'
        run: sudo apt-get update && sudo apt-get install -y libva-dev libva-drm2

      - name: Setup native dependencies
        run: cargo run -p xtask -- setup
        env:
          TARGET_TRIPLE: ${{ matrix.settings.target }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: "1.3.4"

      - name: Build web frontend
        run: |
          bun install
          cd apps/web && bun run build

      - name: Build server and CLI binaries
        run: |
          cargo build --release --bin sd-server --bin sd-cli --features sd-core/heif,sd-core/ffmpeg,sd-core/ai --target ${{ matrix.settings.target }}
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc

      - name: Prepare binaries
        run: |
          mkdir -p dist
          cp target/${{ matrix.settings.target }}/release/sd-server dist/sd-server-${{ matrix.settings.platform }}
          cp target/${{ matrix.settings.target }}/release/sd-cli dist/sd-cli-${{ matrix.settings.platform }}
          chmod +x dist/sd-server-${{ matrix.settings.platform }} dist/sd-cli-${{ matrix.settings.platform }}

      - name: Generate checksums
        run: |
          cd dist
          sha256sum sd-server-${{ matrix.settings.platform }} > sd-server-${{ matrix.settings.platform }}.sha256
          sha256sum sd-cli-${{ matrix.settings.platform }} > sd-cli-${{ matrix.settings.platform }}.sha256

      - name: Create archive
        run: |
          cd dist
          tar -czf sd-server-${{ matrix.settings.platform }}.tar.gz \
            sd-server-${{ matrix.settings.platform }} sd-server-${{ matrix.settings.platform }}.sha256 \
            sd-cli-${{ matrix.settings.platform }} sd-cli-${{ matrix.settings.platform }}.sha256

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: server-${{ matrix.settings.platform }}
          path: dist/sd-server-${{ matrix.settings.platform }}.tar.gz

  # Standalone CLI and daemon for every platform. The names match what
  # `sd update` looks for on the stable channel (see nightly.yml and
  # docs/core/releases.mdx). They carry no Developer ID or Authenticode
  # signature; the checksum beside each one is what the updater verifies.
  cli-build:
    strategy:
      fail-fast: false
      matrix:
        settings:
          - host: macos-15
            target: aarch64-apple-darwin
            platform: macos-aarch64
          - host: macos-15-intel
            target: x86_64-apple-darwin
            platform: macos-x86_64
          - host: blacksmith-4vcpu-ubuntu-2204
            target: x86_64-unknown-linux-gnu
            platform: linux-x86_64
          - host: blacksmith-4vcpu-ubuntu-2204-arm
            target: aarch64-unknown-linux-gnu
            platform: linux-aarch64
          # Blacksmith has no Windows runners.
          - host: windows-latest
            target: x86_64-pc-windows-msvc
            platform: windows-x86_64
    name: CLI - ${{ matrix.settings.platform }}
    runs-on: ${{ matrix.settings.host }}
    timeout-minutes: 120
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          target: ${{ matrix.settings.target }}

      # The runner's preinstalled libunwind blocks libgstreamer1.0-dev, which
      # setup.sh installs.
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get remove libunwind-* || true
          ./scripts/setup.sh

      - name: Build sd-cli and sd-daemon
        shell: bash
        env:
          SD_GIT_SHA: ${{ github.sha }}
          OPENSSL_STATIC: '1'
          OPENSSL_NO_VENDOR: '0'
        run: |
          cargo build --release --locked \
            -p sd-cli -p sd-core --bin sd-cli --bin sd-daemon \
            --target ${{ matrix.settings.target }}

      - name: Prepare binaries and checksums
        shell: bash
        run: |
          set -eux
          mkdir -p dist
          platform=${{ matrix.settings.platform }}
          exe=""
          if [ "${{ runner.os }}" = "Windows" ]; then exe=".exe"; fi
          cp "target/${{ matrix.settings.target }}/release/sd-cli$exe" "dist/sd-$platform$exe"
          cp "target/${{ matrix.settings.target }}/release/sd-daemon$exe" "dist/sd-daemon-$platform$exe"
          chmod +x dist/*
          cd dist
          for f in "sd-$platform$exe" "sd-daemon-$platform$exe"; do
            if command -v sha256sum >/dev/null; then
              sha256sum "$f" > "$f.sha256"
            else
              shasum -a 256 "$f" > "$f.sha256"
            fi
          done
          cat ./*.sha256

      - name: Smoke test
        shell: bash
        run: |
          exe=""
          if [ "${{ runner.os }}" = "Windows" ]; then exe=".exe"; fi
          "./dist/sd-${{ matrix.settings.platform }}$exe" --version

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.settings.platform }}
          path: dist/*
          if-no-files-found: error

  # A dry run builds the desktop app for Linux only: the macOS and Windows
  # bundles are only worth building when they can be signed.
  desktop-plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - id: plan
        env:
          DRY_RUN: ${{ inputs.dry_run == true }}
        run: |
          all='[
            {"host":"macos-26","target":"aarch64-apple-darwin","bundles":"dmg,app","os":"darwin","arch":"aarch64"},
            {"host":"macos-26","target":"x86_64-apple-darwin","bundles":"dmg,app","os":"darwin","arch":"x86_64"},
            {"host":"blacksmith-4vcpu-windows-2025","target":"x86_64-pc-windows-msvc","bundles":"nsis","os":"windows","arch":"x86_64"},
            {"host":"blacksmith-16vcpu-ubuntu-2404","target":"x86_64-unknown-linux-gnu","bundles":"deb","os":"linux","arch":"x86_64"},
            {"host":"blacksmith-8vcpu-ubuntu-2404-arm","target":"aarch64-unknown-linux-gnu","bundles":"deb","os":"linux","arch":"aarch64"}
          ]'
          filter='.'
          if [ "$DRY_RUN" = "true" ]; then filter='map(select(.os == "linux"))'; fi
          echo "matrix=$(echo "$all" | jq -c "$filter")" >> "$GITHUB_OUTPUT"

  # V2 Desktop builds
  desktop-main:
    needs: desktop-plan
    strategy:
      fail-fast: false
      matrix:
        settings: ${{ fromJSON(needs.desktop-plan.outputs.matrix) }}
    name: Desktop - Main ${{ matrix.settings.target }}
    runs-on: ${{ matrix.settings.host }}
    steps:
      - name: Symlink target to C:\
        if: ${{ runner.os == 'Windows' }}
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path C:\spacedrive_target
          New-Item -Path target -ItemType Junction -Value C:\spacedrive_target

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install VA-API libraries
        if: matrix.settings.target == 'aarch64-unknown-linux-gnu'
        run: sudo apt-get update && sudo apt-get install -y libva-dev libva-drm2

      - name: Install NASM
        if: ${{ runner.os == 'Windows' }}
        uses: ilammy/setup-nasm@v1

      - name: Install Apple API key
        if: ${{ runner.os == 'macOS' && inputs.dry_run != true }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys/
          cd ~/.appstoreconnect/private_keys/
          echo ${{ secrets.APPLE_API_KEY_BASE64 }} >> AuthKey_${{ secrets.APPLE_API_KEY }}.p8.base64
          base64 --decode -i AuthKey_${{ secrets.APPLE_API_KEY }}.p8.base64 -o AuthKey_${{ secrets.APPLE_API_KEY }}.p8
          rm AuthKey_${{ secrets.APPLE_API_KEY }}.p8.base64

      - name: Install Codesigning Certificate
        if: ${{ runner.os == 'macOS' && inputs.dry_run != true }}
        uses: apple-actions/import-codesign-certs@v2
        with:
          p12-file-base64: ${{ secrets.APPLE_CERTIFICATE }}
          p12-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}

      - name: Setup System and Rust
        uses: ./.github/actions/setup-system
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          target: ${{ matrix.settings.target }}

      - name: Setup Bun and dependencies
        uses: ./.github/actions/setup-bun
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify native deps were downloaded
        if: runner.os == 'Linux'
        run: |
          echo "=== Native dependencies verification ==="
          if [ ! -d "apps/.deps/lib" ]; then
            echo "ERROR: apps/.deps/lib directory does not exist"
            exit 1
          fi

          echo "Contents of apps/.deps/lib/:"
          ls -lh apps/.deps/lib/ | head -20

          SO_COUNT=$(find apps/.deps/lib/ -name "*.so*" | wc -l)
          echo "Found $SO_COUNT .so files"

          if [ "$SO_COUNT" -eq 0 ]; then
            echo "ERROR: No .so files found in apps/.deps/lib/"
            exit 1
          fi

          echo "✓ Native dependencies verified"

      - name: Set ARM crypto flags
        if: ${{ matrix.settings.arch == 'aarch64' }}
        shell: bash
        run: |
          echo "CFLAGS=-march=armv8.2-a+crypto" >> $GITHUB_ENV
          echo "CXXFLAGS=-march=armv8.2-a+crypto" >> $GITHUB_ENV

      # A dry run passes no signing secrets and turns off the updater
      # artifacts, which cannot be produced without the Tauri key. Without a
      # tag or release id tauri-action only builds, it never uploads.
      - name: Build with tauri-action
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ inputs.dry_run != true && secrets.TAURI_PRIVATE_KEY || '' }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ inputs.dry_run != true && secrets.TAURI_KEY_PASSWORD || '' }}
          ENABLE_CODE_SIGNING: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_PROVIDER_SHORT_NAME: ${{ secrets.APPLE_PROVIDER_SHORT_NAME }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          CPATH: ${{ github.workspace }}/apps/.deps/include
          C_INCLUDE_PATH: ${{ github.workspace }}/apps/.deps/include
        with:
          projectPath: apps/tauri
          args: >-
            --target ${{ matrix.settings.target }}
            --bundles ${{ matrix.settings.bundles }}
            ${{ matrix.settings.os == 'windows' && '--config src-tauri/tauri.windows.conf.json' || '' }}
            ${{ inputs.dry_run == true && '--config ''{"bundle":{"createUpdaterArtifacts":false}}''' || '' }}
          includeUpdaterJson: true

      - name: Package frontend
        if: ${{ runner.os == 'Linux' }}
        run: |
          set -eux
          XZ_OPT='-T0 -7' tar -cJf apps/tauri/dist.tar.xz -C apps/tauri/dist .

      - name: Publish Artifacts
        uses: ./.github/actions/publish-artifacts
        with:
          os: ${{ matrix.settings.os }}
          arch: ${{ matrix.settings.arch }}
          target: ${{ matrix.settings.target }}
          profile: release

      - name: Cleanup keychain
        if: always() && runner.os == 'macOS'
        run: security delete-keychain signing_temp.keychain || true

  # Create unified release with Server, CLI, and Desktop artifacts
  release:
    if: startsWith(github.ref, 'refs/tags/') && inputs.dry_run != true
    runs-on: blacksmith-4vcpu-ubuntu-2404
    name: Create Release
    needs: [server-build, cli-build, desktop-main]
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            server-*/*
            cli-*/*
            */*.dmg
            */*.exe
            */*.nsis.zip
            */*.deb
            */*.tar.xz
            */*.tar.gz
            */*.sig
            */*.json
