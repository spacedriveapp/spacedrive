name: Core Tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  RUST_BACKTRACE: short
  RUSTUP_MAX_RETRIES: 10
  SD_AUTH: disabled

# Cancel previous runs of the same workflow on the same branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        suite:
          - name: unit
            # sd-fs-watcher's lib tests exercise the Linux inotify handler and
            # live outside the sd-core runner, so the unit job runs them too.
            run: |
              cargo run -p xtask -- test-core --unit --verbose
              cargo test -p sd-fs-watcher --lib
          - name: integration
            run: cargo run -p xtask -- test-core --integration --verbose
          # The R8 source runtime acceptance suites (docs/core/acceptance/
          # source-runtime.md). Their own job because the integration job
          # already sits at the hour on a cold cache.
          - name: acceptance
            run: cargo run -p xtask -- test-core --acceptance --verbose
    name: Core Tests (${{ matrix.suite.name }}, ubuntu-24.04)
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 90
    permissions:
      contents: read
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          restore-cache: "false"

      # Blacksmith serves actions/cache transparently, so the upstream action
      # is the right one here. Each half keeps its own key: the two jobs build
      # different test targets and would otherwise overwrite each other.
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: core-tests-${{ matrix.suite.name }}

      - name: Install system dependencies
        run: ./scripts/setup.sh

      # The ZFS locked volumes acceptance suite builds a file-backed pool.
      # The Blacksmith kernel ships no zfs module, so the suite skips with a
      # reason here and runs for real in the zfs job below; the step stays
      # so a runner image that gains the module runs it here too.
      - name: Install ZFS
        if: matrix.suite.name == 'acceptance'
        run: |
          sudo apt-get install -y zfsutils-linux
          uname -r; ls /lib/modules/"$(uname -r)" || true
          apt-cache policy "linux-headers-$(uname -r)" "linux-modules-extra-$(uname -r)" || true
          sudo modprobe zfs || echo "zfs kernel module unavailable; the ZFS suite will skip"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: "1.3.4"

      - name: Install TypeScript dependencies
        run: bun install --frozen-lockfile

      - name: Run tests
        run: ${{ matrix.suite.run }}

  # The ZFS half of the locked volumes acceptance (docs/core/acceptance/
  # volumes.md rows 5 and 6) needs a kernel with the zfs module, which the
  # Blacksmith image lacks and GitHub's ubuntu-24.04 image carries in
  # linux-modules-extra. One suite, so the cold build is the whole cost.
  zfs:
    name: Core Tests (zfs acceptance, ubuntu-24.04)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          restore-cache: "false"

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: core-tests-zfs

      # The hosted runner's preinstalled libunwind blocks the gstreamer dev
      # package setup.sh installs, as nightly.yml works around too.
      - name: Install system dependencies
        run: |
          sudo apt-get remove libunwind-* || true
          ./scripts/setup.sh

      - name: Install ZFS
        run: |
          sudo apt-get install -y zfsutils-linux
          sudo modprobe zfs
          zfs version

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: "1.3.4"

      - name: Install TypeScript dependencies
        run: bun install --frozen-lockfile

      - name: Run the ZFS locked volumes suite
        run: RUST_LOG=sd_core=info cargo test -p sd-core --test zfs_locked_volumes_acceptance_test -- --test-threads=1 --nocapture

  # Windows is the one supported desktop platform the rewrite has never been
  # built on, so this job is the evidence for the cross-platform gate in
  # docs/core/releases.mdx. It runs on GitHub's hosted image because
  # Blacksmith has no Windows runners. The sd-core lib tests and the sd-cli
  # tests are the cheap half; the integration and acceptance suites assume a
  # Linux filesystem and are tracked in docs/plans/2026-10-09-windows-gap.md.
  # continue-on-error keeps the job from gating main until it has been green
  # twice; drop it then.
  windows:
    name: Core Tests (windows unit, continue-on-error until green twice)
    runs-on: windows-latest
    timeout-minutes: 60
    continue-on-error: true
    permissions:
      contents: read
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    env:
      # PDBs for every test binary and their link time are most of a Windows
      # debug build; the tests do not need symbols.
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # The hosted image has no rustup toolchain for the pinned channel, so
      # setup-rust installs it from rust-toolchain.toml.
      - name: Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          restore-cache: "false"

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: core-tests-windows

      - name: Build sd-cli and sd-daemon
        run: cargo build --locked -p sd-cli -p sd-core --bin sd-cli --bin sd-daemon

      - name: Run sd-core unit tests
        run: cargo test --locked -p sd-core --lib

      - name: Run sd-cli tests
        run: cargo test --locked -p sd-cli

