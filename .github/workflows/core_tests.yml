name: Core Tests

on:
  push:
    branches: ["sources", "ci/core-tests-on-sources"]
  pull_request:
    branches: ["sources"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  RUST_BACKTRACE: short
  RUSTUP_MAX_RETRIES: 10
  SD_AUTH: disabled

# Cancel previous runs of the same workflow on the same branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        suite:
          - name: unit
            # sd-fs-watcher's lib tests exercise the Linux inotify handler and
            # live outside the sd-core runner, so the unit job runs them too.
            run: |
              cargo run -p xtask -- test-core --unit
              cargo test -p sd-fs-watcher --lib
          - name: integration
            run: cargo run -p xtask -- test-core --integration
    name: Core Tests (${{ matrix.suite.name }}, ubuntu-24.04)
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 90
    permissions:
      contents: read
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          restore-cache: "false"

      # Blacksmith serves actions/cache transparently, so the upstream action
      # is the right one here. Each half keeps its own key: the two jobs build
      # different test targets and would otherwise overwrite each other.
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: core-tests-${{ matrix.suite.name }}

      - name: Install system dependencies
        run: ./scripts/setup.sh

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: "1.3.4"

      - name: Install TypeScript dependencies
        run: bun install --frozen-lockfile

      - name: Run tests
        run: ${{ matrix.suite.run }}
