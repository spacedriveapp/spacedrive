name: CI

on:
  push:
    branches:
      - main
  pull_request:
  merge_group:

env:
  SPACEDRIVE_CUSTOM_APT_FLAGS: --no-install-recommends
  # From: https://github.com/rust-lang/rust-analyzer/blob/master/.github/workflows/ci.yaml
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  RUST_BACKTRACE: short
  RUSTUP_MAX_RETRIES: 10
  SD_AUTH: disabled

# Cancel previous runs of the same workflow on the same branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rustfmt:
    name: Rust Formatting
    runs-on: blacksmith-4vcpu-ubuntu-2204
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Symlink target to C:\
        if: ${{ runner.os == 'Windows' }}
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path C:\spacedrive_target
      - name: Symlink target to C:\
        if: ${{ runner.os == 'Windows' }}
        shell: powershell
        run: |
          New-Item -Path target -ItemType Junction -Value C:\spacedrive_target

      - name: Checkout repository
        uses: actions/checkout@v4
        # TODO: Re-enable when submodule repos are public
        # with:
        #   submodules: recursive

      - name: Check if files have changed
        uses: dorny/paths-filter@v3
        continue-on-error: true
        id: filter
        with:
          filters: |
            changes:
              - 'apps/cli/**'
              - 'apps/desktop/crates/**'
              - 'apps/desktop/src-tauri/**'
              - 'apps/mobile/crates/**'
              - 'apps/server/**'
              - 'core/**'
              - 'crates/**'
              - 'extensions/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.github/workflows/ci.yml'
              - '.github/actions/setup-rust/**'
              - '.github/actions/setup-system/**'

      - name: Setup Rust
        if: steps.filter.outcome != 'success' || steps.filter.outputs.changes == 'true'
        uses: ./.github/actions/setup-rust
        with:
          restore-cache: "false"

      - name: Run rustfmt
        if: steps.filter.outcome != 'success' || steps.filter.outputs.changes == 'true'
        run: cargo fmt --all -- --check

  clippy:
    strategy:
      fail-fast: false # Don't cancel other platforms if one fails
      matrix:
        settings:
          - host: blacksmith-4vcpu-ubuntu-2404
            label: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
    name: Clippy (${{ matrix.settings.label }})
    runs-on: ${{ matrix.settings.host }}
    permissions:
      contents: read
    timeout-minutes: 45
    steps:
      - name: Symlink target to C:\
        if: ${{ runner.os == 'Windows' }}
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path C:\spacedrive_target
          New-Item -Path target -ItemType Junction -Value C:\spacedrive_target

      - name: Checkout repository
        uses: actions/checkout@v4
        # TODO: Re-enable when submodule repos are public
        # with:
        #   submodules: recursive

      - name: Find files that have changed
        uses: dorny/paths-filter@v3
        continue-on-error: true
        id: filter
        with:
          filters: |
            changes:
              - ${{ runner.os == 'Windows' && 'scripts/setup.ps1' || 'scripts/setup.sh' }}
              - 'scripts/preprep.mjs'
              - 'apps/cli/**'
              - 'apps/desktop/crates/**'
              - 'apps/desktop/src-tauri/**'
              - 'apps/mobile/crates/**'
              - 'apps/server/**'
              - 'core/**'
              - 'crates/**'
              - 'extensions/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.github/workflows/ci.yml'
              - '.github/actions/setup-rust/**'
              - '.github/actions/setup-system/**'

      - name: Setup System and Rust
        if: steps.filter.outcome != 'success' || steps.filter.outputs.changes == 'true'
        uses: ./.github/actions/setup-system
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Clippy
        if: steps.filter.outcome != 'success' || steps.filter.outputs.changes == 'true'
        run: cargo clippy --workspace --locked -- -D warnings

      # - name: Run tests
      #   if: steps.filter.outcome != 'success' || steps.filter.outputs.changes == 'true'
      #   run: cargo test --workspace --all-features --locked --target ${{ matrix.settings.target }}

  typescript:
    name: TypeScript
    runs-on: blacksmith-4vcpu-ubuntu-2204
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check if files have changed
        uses: dorny/paths-filter@v3
        continue-on-error: true
        id: filter
        with:
          filters: |
            changes:
              - 'apps/tauri/**'
              - 'packages/**'
              - 'package.json'
              - 'bun.lockb'
              - 'tsconfig.json'
              - '.github/workflows/ci.yml'

      - name: Setup Bun
        if: steps.filter.outcome != 'success' || steps.filter.outputs.changes == 'true'
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: "1.3.4"

      - name: Install dependencies
        if: steps.filter.outcome != 'success' || steps.filter.outputs.changes == 'true'
        run: bun install --frozen-lockfile

      - name: TypeScript typecheck
        if: steps.filter.outcome != 'success' || steps.filter.outputs.changes == 'true'
        run: bun run typecheck
        working-directory: apps/tauri

  docs:
    name: Docs
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check if files have changed
        uses: dorny/paths-filter@v3
        continue-on-error: true
        id: filter
        with:
          filters: |
            changes:
              - 'docs/**'
              - '.github/workflows/ci.yml'

      - name: Setup Bun
        if: steps.filter.outcome != 'success' || steps.filter.outputs.changes == 'true'
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: "1.3.4"

      # The docs site is its own bun project with its own lockfile, not a
      # member of the repo workspace.
      - name: Install dependencies
        if: steps.filter.outcome != 'success' || steps.filter.outputs.changes == 'true'
        run: bun install --frozen-lockfile
        working-directory: docs

      - name: Typecheck
        if: steps.filter.outcome != 'success' || steps.filter.outputs.changes == 'true'
        run: bun run types:check
        working-directory: docs

      - name: Build
        if: steps.filter.outcome != 'success' || steps.filter.outputs.changes == 'true'
        run: bun run build
        working-directory: docs
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  generated-types:
    name: Generated types
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check if files have changed
        uses: dorny/paths-filter@v3
        continue-on-error: true
        id: filter
        with:
          filters: |
            changes:
              - 'core/**'
              - 'crates/**'
              - 'apps/tauri/src-tauri/**'
              - 'packages/ts-client/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.github/workflows/ci.yml'
              - '.github/actions/setup-rust/**'

      - name: Setup Rust
        if: steps.filter.outcome != 'success' || steps.filter.outputs.changes == 'true'
        uses: ./.github/actions/setup-rust
        with:
          restore-cache: "false"

      # Own key: this job builds a debug sd-core binary, which no other ci.yml
      # job produces, so sharing a key with clippy would only evict its cache.
      - name: Cache Rust dependencies
        if: steps.filter.outcome != 'success' || steps.filter.outputs.changes == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: generated-types

      - name: Install system dependencies
        if: steps.filter.outcome != 'success' || steps.filter.outputs.changes == 'true'
        run: ./scripts/setup.sh

      - name: Generate TypeScript types
        if: steps.filter.outcome != 'success' || steps.filter.outputs.changes == 'true'
        run: cargo run --locked --bin generate_typescript_types

      - name: Fail on stale TypeScript types
        if: steps.filter.outcome != 'success' || steps.filter.outputs.changes == 'true'
        run: |
          if ! git diff --exit-code -- packages/ts-client/src/generated; then
            echo "::error::packages/ts-client/src/generated is out of date. Run 'cargo run --bin generate_typescript_types' and commit the result."
            exit 1
          fi

      # tauri-build rewrites gen/schemas from the capability files during the
      # desktop crate's build script; a check is enough to run it.
      - name: Generate Tauri schemas
        if: steps.filter.outcome != 'success' || steps.filter.outputs.changes == 'true'
        run: cargo check --locked -p spacedrive

      # Key order in the schema files follows whether serde_json's
      # preserve_order feature was unified into tauri-build, which a workspace
      # build does (axum, gpui) and a -p build does not, so the files are
      # compared as parsed JSON rather than bytes. Only the schemas the Linux
      # build writes are checked; macOS-schema.json is written on macOS only.
      - name: Fail on stale Tauri schemas
        if: steps.filter.outcome != 'success' || steps.filter.outputs.changes == 'true'
        run: |
          stale=0
          for file in $(git diff --name-only -- apps/tauri/src-tauri/gen/schemas); do
            if ! python3 -c '
          import json, subprocess, sys
          path = sys.argv[1]
          committed = json.loads(subprocess.check_output(["git", "show", "HEAD:" + path]))
          with open(path) as f:
              generated = json.load(f)
          sys.exit(0 if committed == generated else 1)
          ' "$file"; then
              echo "::error file=$file::$file is out of date."
              stale=1
            fi
          done
          if [ "$stale" = 1 ]; then
            echo "::error::Tauri schemas are out of date. Run 'cargo check -p spacedrive' and commit apps/tauri/src-tauri/gen/schemas."
            exit 1
          fi

  secrets:
    name: Secrets scan
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -fsSL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          sudo tar -xzf gitleaks.tar.gz -C /usr/local/bin gitleaks
          rm gitleaks.tar.gz
          gitleaks version

      # Every commit in the PR, so a secret committed and then removed before
      # review still fails the check.
      - name: Scan pull request commits
        if: github.event_name == 'pull_request'
        run: gitleaks git --no-banner --redact --exit-code 1 --config .gitleaks.toml --log-opts "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"

      - name: Scan checked-out tree
        run: gitleaks dir . --no-banner --redact --exit-code 1 --config .gitleaks.toml

  license:
    name: License and notices
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check LICENSE, NOTICE, and README agree
        run: |
          set -euo pipefail
          grep -q "Apache License" LICENSE
          grep -q "Version 2.0, January 2004" LICENSE
          echo "LICENSE is Apache-2.0"
          test -f NOTICE
          grep -q "Apache License, Version 2.0" NOTICE
          relicense_date=$(grep -oE "Releases before [0-9]{4}-[0-9]{2}-[0-9]{2} were published under AGPL-3.0" README.md | grep -oE "[0-9]{4}-[0-9]{2}-[0-9]{2}")
          test -n "$relicense_date"
          grep -q "AGPL-3.0" NOTICE
          grep -q "$relicense_date" NOTICE
          echo "NOTICE records the AGPL-3.0 history up to $relicense_date, matching README"
